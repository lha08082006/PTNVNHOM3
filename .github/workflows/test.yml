# Chạy kiểm thử mỗi lần push / mở pull request
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Kiểm thử luồng chính (bộ nhớ trong)
        run: npm test
      - name: Kiểm thử giao diện (lỗi JS, tràn ngang, CSP) – tiếng Việt
        run: npm run test:pages
      - name: Kiểm thử giao diện – tiếng Anh
        run: npm run test:pages
        env:
          PAGE_LANG: en
      - name: Trọn luồng đặt vé trên trình duyệt (e2e)
        run: npm run test:e2e
      - name: Tiếp cận WCAG 2.1 AA (axe-core)
        run: npm run test:a11y
