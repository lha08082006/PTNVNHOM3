<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="lang.js"></script>
  <meta name="robots" content="noindex">
  <title>Không tìm thấy trang - Beta Cinemas</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/icon-ticket.png">
  <style>
    :root { --navy: #005198; --orange: #c94200; --text: #0f172a; --muted: #64748b; --bg: #f1f5f9; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --text: #e2e8f0; --muted: #94a3b8; --bg: #0b1220; --card: #111a2e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { box-sizing: border-box; max-width: 480px; width: 100%; text-align: center; background: var(--card); border-radius: 18px; padding: 40px 28px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    .code { font-size: 64px; font-weight: 900; color: var(--navy); line-height: 1; letter-spacing: -2px; }
    h1 { font-size: 20px; margin: 14px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.6; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 11px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    .primary { background: var(--navy); color: #fff; }
    .ghost { border: 1.5px solid var(--navy); color: var(--navy); }
    @media (prefers-color-scheme: dark) { .ghost { color: #7cb6f0; border-color: #7cb6f0; } }
  
    /* Accessibility: focus bàn phím rõ ràng + tôn trọng giảm chuyển động */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid #005198 !important; outline-offset: 2px !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Không tìm thấy trang bạn cần</h1>
    <p>Đường dẫn có thể đã thay đổi hoặc không còn tồn tại. Bạn có thể quay về trang chủ hoặc xem lịch chiếu mới nhất.</p>
    <div class="row">
      <a class="primary" href="/home.html">Về trang chủ</a>
      <a class="ghost" href="/schedule.html">Lịch chiếu</a>
    </div>
  </main>
</body>
</html>
