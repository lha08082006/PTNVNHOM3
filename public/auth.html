<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Đăng nhập - Beta Cinemas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/prototype-theme.css">

  <style>
    :root {
      --bg-light: #f8fafc;
      --card-light: #ffffff;
      --border-light: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-orange: #ff5400;
      --accent-gold: #005198;
      --beta-blue: #005198;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-light);
      color: var(--text-main);
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    /* Các nút chuẩn thiết kế Design Component */
    .btn-b, .btn-o, input, select {
      font: inherit;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      outline: none;
    }

    .btn-b {
      border: 0;
      background: var(--accent-orange);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-b:hover {
      background: #e04b00;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255, 84, 0, 0.3);
    }

    .btn-o {
      border: 1.5px solid var(--border-light);
      background: #ffffff;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-o:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: var(--beta-blue);
    }

    input, select {
      border: 1.5px solid var(--border-light);
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--beta-blue);
      box-shadow: 0 0 0 3px rgba(0, 81, 152, 0.1);
    }

    input[type=checkbox] {
      min-height: 0;
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--accent-orange);
      cursor: pointer;
    }

    .card-box {
      background: var(--card-light);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 32px;
      width: 440px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 81, 152, 0.08);
    }

    .text-muted {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    .flex-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

      .auth-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13.5px;
    }
  </style>
  <script src="js/layout.js"></script>
</head>
<body>

  <script>Layout.header({"authPage": true})</script>

  <!-- Main Container -->
  <main style="flex: 1; padding: 40px 20px 80px; display: flex; align-items: center; justify-content: center;">
    
    <!-- ========================================== -->
    <!-- FORM 1: ĐĂNG NHẬP (Auth.dc.html)           -->
    <!-- ========================================== -->
    <section class="card-box" id="view-login" aria-label="Đăng nhập">
      <div>
        <h1 style="font-size: 28px; font-weight: 800;">Đăng nhập</h1>
        <p class="text-muted" style="margin-top: 4px;">Chào mừng trở lại Beta Cinemas</p>
      </div>

      <label class="form-field">
        Email / Số điện thoại
        <input type="text" id="login-id" placeholder="Nhập email hoặc số điện thoại" autocomplete="username">
      </label>

      <div style="display: flex; gap: 8px; align-items: flex-end;">
        <label class="form-field" style="flex: 1;">
          Mật khẩu
          <input type="password" id="input-login-password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <button type="button" class="btn-o" style="padding: 0 16px;" onclick="togglePasswordVisibility('input-login-password', this)">Hiện</button>
      </div>

      <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px;">
        <label style="display: flex; gap: 8px; align-items: center; cursor: pointer;">
          <input type="checkbox" id="login-remember" checked>
          Ghi nhớ đăng nhập
        </label>
        <a href="javascript:void(0)" onclick="alert('Vui lòng liên hệ hotline 1900 636 807 để khôi phục mật khẩu tài khoản.')" style="color: var(--accent-gold);">Quên mật khẩu?</a>
      </div>

      <p class="auth-error" id="login-error" role="alert"></p>
      <button class="btn-b" onclick="handleLogin()">Đăng nhập</button>
      <p class="text-muted" style="font-size: 12.5px; text-align: center; margin-top: -6px;">
        Tài khoản demo: <strong>luonghonganh@betacinemas.vn</strong> / <strong>12345678</strong>
      </p>

      <p class="text-muted" style="text-align: center;">hoặc tiếp tục với</p>

      <div class="flex-group" style="gap: 8px;">
        <button class="btn-o" style="flex: 1;" onclick="handleSocialAuth('Google')">Google</button>
        <button class="btn-o" style="flex: 1;" onclick="handleSocialAuth('Facebook')">Facebook</button>
      </div>

      <p class="text-muted" style="text-align: center;">
        Chưa có tài khoản? <a href="javascript:void(0)" onclick="switchToView('register')" style="color: var(--accent-gold); font-weight: 600;">Đăng ký ngay</a>
      </p>
    </section>

    <!-- ========================================== -->
    <!-- FORM 2: ĐĂNG KÝ (Register.dc.html)         -->
    <!-- ========================================== -->
    <section class="card-box" id="view-register" aria-label="Đăng ký" style="display: none;">
      <div>
        <h1 style="font-size: 28px; font-weight: 800;">Đăng ký</h1>
        <p class="text-muted" style="margin-top: 4px;">Tạo tài khoản Beta Club để tích điểm và nhận ưu đãi</p>
      </div>

      <label class="form-field">
        Họ tên
        <input type="text" id="reg-name" placeholder="Nguyễn Văn A" autocomplete="name">
      </label>

      <label class="form-field">
        Số điện thoại
        <input type="tel" id="reg-phone" placeholder="09xxxxxxxx" autocomplete="tel">
      </label>

      <label class="form-field">
        Email
        <input type="email" id="reg-email" placeholder="name@example.com" autocomplete="email">
      </label>

      <label class="form-field">
        Ngày sinh
        <input type="date" id="reg-dob">
        <span style="font-weight: 400; font-size: 12px; color: var(--text-muted);">Dùng để đối chiếu độ tuổi xem phim</span>
      </label>

      <label class="form-field">
        Mật khẩu
        <input type="password" id="reg-password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password">
      </label>

      <label class="form-field">
        Xác nhận mật khẩu
        <input type="password" id="reg-password2" placeholder="••••••••" autocomplete="new-password">
      </label>

      <label style="display: flex; gap: 8px; font-size: 13px; align-items: flex-start; cursor: pointer; color: var(--text-muted);">
        <input type="checkbox" id="reg-agree" style="margin-top: 2px;">
        <span>Tôi đồng ý điều khoản sử dụng và chính sách bảo mật</span>
      </label>

      <p class="auth-error" id="register-error" role="alert"></p>
      <button class="btn-b" onclick="handleRegister()">Tạo tài khoản</button>

      <p class="text-muted" style="text-align: center;">hoặc tiếp tục với</p>

      <div class="flex-group" style="gap: 8px;">
        <button class="btn-o" style="flex: 1;" onclick="handleSocialAuth('Google')">Google</button>
        <button class="btn-o" style="flex: 1;" onclick="handleSocialAuth('Facebook')">Facebook</button>
      </div>

      <p class="text-muted" style="text-align: center;">
        Đã có tài khoản? <a href="javascript:void(0)" onclick="switchToView('login')" style="color: var(--accent-gold); font-weight: 600;">Đăng nhập</a>
      </p>
    </section>

  </main>

  <!-- CHÂN TRANG FOOTER CHÍNH THỨC -->
  <script>Layout.footer()</script>


  <!-- Script điều khiển hiển thị Đăng nhập / Đăng ký và Toggle mật khẩu -->
  <script>
    function switchToView(view) {
      const loginSection = document.getElementById('view-login');
      const registerSection = document.getElementById('view-register');
      const title = document.getElementById('page-title');

      if (view === 'register') {
        loginSection.style.display = 'none';
        registerSection.style.display = 'flex';
        title.innerText = 'Đăng ký tài khoản - Beta Cinemas';
        window.location.hash = 'register';
      } else {
        loginSection.style.display = 'flex';
        registerSection.style.display = 'none';
        title.innerText = 'Đăng nhập - Beta Cinemas';
        window.location.hash = 'login';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Ẩn';
      } else {
        input.type = 'password';
        btn.innerText = 'Hiện';
      }
    }

    // =====================================================================
    // ĐĂNG NHẬP / ĐĂNG KÝ (bản demo lưu trên trình duyệt — khi có database
    // sẽ thay bằng API; mật khẩu chỉ lưu dạng băm SHA-256)
    // =====================================================================
    const ACCOUNTS_KEY = 'BETA_ACCOUNTS';
    const DEMO_ACCOUNT = {
      name: 'LƯƠNG HỒNG ANH', phone: '0987654321', email: 'luonghonganh@betacinemas.vn', dob: '2006-08-08',
      // sha256("12345678")
      passHash: 'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f'
    };

    function loadAccounts() {
      try {
        const list = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]');
        if (!list.some(a => a.email === DEMO_ACCOUNT.email)) list.unshift(DEMO_ACCOUNT);
        return list;
      } catch (e) {
        return [DEMO_ACCOUNT];
      }
    }

    function saveAccounts(list) {
      try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list)); } catch (e) {}
    }

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
    }

    // Sau khi đăng nhập quay về trang khách đang xem (?next=...), mặc định là trang tài khoản
    function goNext() {
      const next = new URLSearchParams(location.search).get('next') || '';
      location.href = /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? next : 'account.html';
    }

    function startSession(acc) {
      Layout.setUser({ name: acc.name, email: acc.email, phone: acc.phone, dob: acc.dob });
    }

    async function handleLogin() {
      const id = document.getElementById('login-id').value.trim().toLowerCase();
      const pass = document.getElementById('input-login-password').value;
      if (!id || !pass) return showError('login-error', 'Vui lòng nhập email/số điện thoại và mật khẩu.');

      const acc = loadAccounts().find(a => a.email.toLowerCase() === id || a.phone === id);
      if (!acc || acc.passHash !== await sha256(pass)) {
        return showError('login-error', 'Email/số điện thoại hoặc mật khẩu không đúng.');
      }
      showError('login-error', '');
      startSession(acc);
      goNext();
    }

    async function handleRegister() {
      const v = id => document.getElementById(id).value.trim();
      const name = v('reg-name').toUpperCase();
      const phone = v('reg-phone').replace(/[\s.]/g, '');
      const email = v('reg-email').toLowerCase();
      const dob = v('reg-dob');
      const pass = document.getElementById('reg-password').value;
      const pass2 = document.getElementById('reg-password2').value;

      let err = '';
      if (name.length < 2) err = 'Vui lòng nhập họ tên.';
      else if (!/^0\d{9}$/.test(phone)) err = 'Số điện thoại phải gồm 10 chữ số và bắt đầu bằng 0.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) err = 'Email không hợp lệ.';
      else if (!dob) err = 'Vui lòng chọn ngày sinh.';
      else if (pass.length < 8) err = 'Mật khẩu phải có ít nhất 8 ký tự.';
      else if (pass !== pass2) err = 'Mật khẩu xác nhận không khớp.';
      else if (!document.getElementById('reg-agree').checked) err = 'Bạn cần đồng ý điều khoản sử dụng.';

      const list = loadAccounts();
      if (!err && list.some(a => a.email === email)) err = 'Email này đã được đăng ký.';
      if (!err && list.some(a => a.phone === phone)) err = 'Số điện thoại này đã được đăng ký.';
      if (err) return showError('register-error', err);

      const acc = { name, phone, email, dob, passHash: await sha256(pass) };
      list.push(acc);
      saveAccounts(list);
      showError('register-error', '');
      startSession(acc);
      goNext();
    }

    // Enter để gửi form
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('view-login').style.display !== 'none') handleLogin();
      else handleRegister();
    });

    function handleSocialAuth(provider) {
      alert('Đăng nhập bằng ' + provider + ' sẽ được hỗ trợ trong phiên bản sau.');
    }

    // Tự động kiểm tra URL Hash khi tải trang (#register hoặc #login)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash === '#register') {
        switchToView('register');
      } else {
        switchToView('login');
      }
    });
  </script>

</body>
</html>
