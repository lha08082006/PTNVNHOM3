<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch chiếu theo rạp – Beta Cinemas</title>
  <meta name="description" content="Xem lịch chiếu 7 ngày tới tại các cụm rạp Beta Cinemas và chọn suất chiếu phù hợp.">
  <meta name="theme-color" content="#005198">
  <link rel="icon" type="image/png" href="images/ui/favicon.png">
  <link rel="apple-touch-icon" href="images/ui/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beta Cinemas">
  <meta property="og:title" content="Lịch chiếu theo rạp – Beta Cinemas">
  <meta property="og:description" content="Xem lịch chiếu 7 ngày tới tại các cụm rạp Beta Cinemas và chọn suất chiếu phù hợp.">
  <meta property="og:image" content="images/banners/phim-hay-t10.webp">
  
  <!-- Fonts chuẩn nhận diện Beta Cinemas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/prototype-theme.css">

  <style>
    body {
      background-color: #ffffff;
      color: #1e293b;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    /* Thanh chọn ngày (Date Bar) chuẩn y hệt ảnh người dùng gửi */
    .sch-date-bar-official {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 0 0;
      margin-bottom: 20px;
    }
    .date-row-official {
      display: flex;
      align-items: flex-end;
      gap: 30px;
      overflow-x: auto;
    }
    .date-item-official {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      cursor: pointer;
      padding-bottom: 12px;
      position: relative;
      user-select: none;
      white-space: nowrap;
    }
    .date-item-official .d-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
    }
    .date-item-official .d-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }
    /* Active State: Màu xanh dương và có gạch chân xanh dày */
    .date-item-official.active .d-number {
      color: #03599d;
    }
    .date-item-official.active .d-sub {
      color: #03599d;
    }
    .date-item-official.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3.5px;
      background: #03599d;
    }

    /* Chú giải suất chiếu muộn chuẩn */
    .sch-legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      font-size: 13.5px;
      color: #334155;
    }
    .legend-box-late {
      width: 20px;
      height: 18px;
      background: #b9d5f3;
      border-radius: 3px;
      display: inline-block;
    }

    /* Bố cục từng phim (Schedule Movie Card) chuẩn y hệt ảnh */
    .sch-movie-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      margin-bottom: 45px;
      padding-bottom: 40px;
      border-bottom: 1px solid #f1f5f9;
      align-items: flex-start;
    }
    a.sch-poster-box { display: block; }
    .sch-poster-box {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      background: #000;
    }
    .sch-poster-box img {
      width: 100%;
      height: auto;
      display: block;
    }
    .age-badge-corner {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #eab308;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .age-badge-corner.red {
      background: #dc2626;
    }
    .age-badge-corner.green {
      background: #16a34a;
    }

    /* Cột thông tin phim bên phải */
    .sch-movie-details {
      display: flex;
      flex-direction: column;
    }
    .sch-movie-title {
      font-family: 'Be Vietnam Pro', 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #03599d;
      margin: 0 0 10px 0;
      line-height: 1.25;
    }
    .sch-movie-meta-tags {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 22px;
    }
    .sch-movie-meta-tags span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sch-format-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    /* Lưới các ô suất chiếu (Showtime Slots) */
    .sch-slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      max-width: 850px;
    }
    .sch-slot-card {
      background: #ebeef2;
      border-radius: 4px;
      padding: 8px 4px 6px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
    }
    .sch-slot-card:hover {
      background: #dbe4f0;
      border-color: #03599d;
      transform: translateY(-2px);
    }
    .sch-slot-time {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .sch-slot-date {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-top: 2px;
      line-height: 1;
    }
    .sch-slot-seats {
      font-size: 10.5px;
      color: #000000;
      font-weight: 600;
      margin-top: 5px;
      line-height: 1;
    }

    /* Suất chiếu muộn sau 22h00 */
    .sch-slot-card.late {
      background: #b9d5f3;
    }
    .sch-slot-card.late:hover {
      background: #a2c6ed;
      border-color: #03599d;
    }

    @media (max-width: 900px) {
      .sch-movie-row {
        grid-template-columns: 1fr;
      }
      a.sch-poster-box { display: block; }
    .sch-poster-box {
        max-width: 240px;
      }
    }
  </style>
  <script src="js/layout.js"></script>
</head>
<body>

  <script>Layout.header({"cinemaSelect": "schedule", "cinema": "Beta Trần Quang Khải"})</script>

  <!-- Thanh Chọn Ngày Chiếu (Date Bar Chuẩn Y Hệt Ảnh Chụp Của Beta Cinemas) -->
  <section class="sch-date-bar-official">
    <div class="container">
      <div class="date-row-official" id="official-date-bar">
        
        <!-- Ngày 27/10 - T3 (Active) -->
        <div class="date-item-official active" onclick="selectDate(this, '27/10')">
          <span class="d-number">27</span>
          <span class="d-sub">/10 - T3</span>
        </div>

        <!-- Ngày 28/10 - T4 -->
        <div class="date-item-official" onclick="selectDate(this, '28/10')">
          <span class="d-number">28</span>
          <span class="d-sub">/10 - T4</span>
        </div>

        <!-- Ngày 29/10 - T5 -->
        <div class="date-item-official" onclick="selectDate(this, '29/10')">
          <span class="d-number">29</span>
          <span class="d-sub">/10 - T5</span>
        </div>

        <!-- Ngày 30/10 - T6 -->
        <div class="date-item-official" onclick="selectDate(this, '30/10')">
          <span class="d-number">30</span>
          <span class="d-sub">/10 - T6</span>
        </div>

        <!-- Ngày 31/10 - T7 -->
        <div class="date-item-official" onclick="selectDate(this, '31/10')">
          <span class="d-number">31</span>
          <span class="d-sub">/10 - T7</span>
        </div>

        <!-- Ngày 01/11 - CN -->
        <div class="date-item-official" onclick="selectDate(this, '01/11')">
          <span class="d-number">01</span>
          <span class="d-sub">/11 - CN</span>
        </div>

      </div>
    </div>
  </section>

  <!-- Khung Chứa Nội Dung Lịch Chiếu Chính -->
  <main class="container" style="padding-top: 10px; padding-bottom: 60px;">
    
    <!-- Chú Giải Suất Chiếu Muộn Từ 22h00 -->
    <div class="sch-legend-row">
      <span class="legend-box-late"></span>
      <span>Suất chiếu muộn từ 22h00</span>
    </div>

    <!-- Danh sách phim & suất chiếu render từ js/showtimes.js theo rạp + ngày -->
    <div id="schedule-list"></div>
  </main>

  <!-- CHÂN TRANG FOOTER CHÍNH THỨC -->
  <script>Layout.footer()</script>

  <script src="js/pay-client.js"></script>
  <script src="js/showtimes.js"></script>
  <script>
    // Lịch chiếu theo rạp: chọn rạp (header) + ngày (thanh ngày) -> danh sách phim và suất
    let currentCinema = Showtimes.canonicalCinema(document.getElementById('schedule-cinema-select').value);
    let currentDate = Showtimes.dateTag(new Date());

    function esc(t) {
      return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderSchedule() {
      const box = document.getElementById('schedule-list');
      const movies = Showtimes.moviesOn(currentCinema, currentDate);
      if (!movies.length) {
        box.innerHTML = '<p style="padding: 40px 0; text-align: center; color: #64748b;">Rạp chưa có suất chiếu trong ngày này.</p>';
        return;
      }
      box.innerHTML = movies.map(({ key, slots }) => {
        const m = Pay.getMovieDetail(key);
        const groups = {};
        slots.forEach(x => { (groups[x.format] = groups[x.format] || []).push(x); });
        const grids = Object.keys(groups).map(fmt => `
          <div class="sch-format-title">${esc(fmt.toUpperCase())}</div>
          <div class="sch-slots-grid">${groups[fmt].map(x => {
            const off = x.past || x.available <= 0;
            const href = `seats.html?movie=${encodeURIComponent(key)}&cinema=${encodeURIComponent(currentCinema)}&date=${encodeURIComponent(currentDate)}&time=${encodeURIComponent(x.time)}`;
            return `<a ${off ? 'aria-disabled="true"' : `href="${href}"`} class="sch-slot-card${x.late ? ' late' : ''}"${off ? ' style="opacity: 0.45; pointer-events: none;"' : ''}>
              <span class="sch-slot-time">${x.time}</span>
              ${x.late ? `<span class="sch-slot-date">${esc(currentDate)}</span>` : ''}
              <span class="sch-slot-seats">${x.past ? 'Đã chiếu' : x.available <= 0 ? 'Hết vé' : x.available + ' ghế trống'}</span>
            </a>`;
          }).join('')}</div>`).join('');
        return `
    <div class="sch-movie-row">
      <a class="sch-poster-box" href="movie-detail.html?movie=${key}">
        <span class="age-badge-corner">${esc(m.age)}</span>
        <img src="${m.poster}" alt="${esc(m.shortTitle)}" loading="lazy">
      </a>
      <div class="sch-movie-details">
        <h2 class="sch-movie-title"><a href="movie-detail.html?movie=${key}" style="color: inherit; text-decoration: none;">${esc(m.shortTitle)}</a></h2>
        <div class="sch-movie-meta-tags">
          <span><span style="color: #03599d;">🏷</span> ${esc(m.genre)}</span>
          <span><span style="color: #03599d;">⏱</span> ${esc(m.duration)}</span>
        </div>
        ${grids}
      </div>
    </div>`;
      }).join('');
    }

    function changeCinema(cinemaName) {
      currentCinema = Showtimes.canonicalCinema(cinemaName);
      renderSchedule();
    }

    // Thanh 7 ngày tới
    function renderScheduleRealtimeDates() {
      const bar = document.getElementById('official-date-bar');
      bar.innerHTML = '';
      Showtimes.upcomingDates(7).forEach(d => {
        const item = document.createElement('div');
        item.className = 'date-item-official' + (d.tag === currentDate ? ' active' : '');
        item.setAttribute('role', 'button');
        item.tabIndex = 0;
        item.innerHTML = `<span class="d-number">${d.day}</span><span class="d-sub">/${d.month} - ${d.dow}</span>`;
        item.onclick = () => {
          bar.querySelectorAll('.date-item-official').forEach(x => x.classList.remove('active'));
          item.classList.add('active');
          currentDate = d.tag;
          renderSchedule();
        };
        item.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); } };
        bar.appendChild(item);
      });
    }

    renderScheduleRealtimeDates();
    renderSchedule();
  </script>

</body>
</html>
