<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#00acc1"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg3)"/>
  <!-- Ice cream swirl cup -->
  <g transform="translate(18, 20)">
    <!-- Swirl top -->
    <path d="M22 6 C18 10, 26 12, 23 18 C20 22, 16 24, 25 24 C30 24, 28 20, 26 16 C24 12, 26 8, 22 6 Z" fill="#ff80ab"/>
    <ellipse cx="23" cy="22" rx="10" ry="4" fill="#ff4081"/>
    <!-- Cup -->
    <polygon points="13,24 33,24 30,56 16,56" fill="#f8bbd0"/>
    <rect x="21" y="8" width="3" height="18" fill="#76ff03" rx="1.5"/>
  </g>
  <!-- Popcorn bucket -->
  <g transform="translate(48, 30)">
    <!-- Popcorn pieces -->
    <circle cx="20" cy="12" r="6" fill="#fff59d"/>
    <circle cx="28" cy="10" r="5" fill="#ffe082"/>
    <circle cx="14" cy="15" r="5" fill="#fff9c4"/>
    <circle cx="26" cy="16" r="6" fill="#fff59d"/>
    <!-- Bucket -->
    <polygon points="12,18 36,18 32,54 16,54" fill="#0d47a1"/>
    <rect x="18" y="26" width="12" height="14" fill="#ffe082" rx="2"/>
    <text x="24" y="36" font-size="6" font-family="Arial" font-weight="bold" fill="#0d47a1" text-anchor="middle">beta</text>
  </g>
  <!-- Ribbon Badge -->
  <g transform="translate(10, 78)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#c2185b"/>
    <rect x="2" y="2" width="96" height="20" rx="10" fill="#e91e63"/>
    <text x="50" y="16" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">COMBO ICE-CREAM</text>
  </g>
</svg>
