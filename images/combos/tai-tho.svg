<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38d4c9"/>
      <stop offset="100%" stop-color="#149d94"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg1)"/>
  <!-- Bunny ears cup -->
  <g transform="translate(18, 25)">
    <!-- bunny ears -->
    <path d="M18 18 C14 4, 18 -2, 22 2 C25 6, 23 15, 21 20 Z" fill="#ffb6c1" stroke="#f06292" stroke-width="1.5"/>
    <path d="M19 16 C17 6, 19 1, 21 4 C23 7, 22 13, 20 18 Z" fill="#ffffff"/>
    <path d="M29 18 C33 4, 29 -2, 25 2 C22 6, 24 15, 26 20 Z" fill="#ffb6c1" stroke="#f06292" stroke-width="1.5"/>
    <path d="M28 16 C30 6, 28 1, 26 4 C24 7, 25 13, 27 18 Z" fill="#ffffff"/>
    <!-- cup -->
    <polygon points="12,22 35,22 31,58 16,58" fill="#f48fb1"/>
    <!-- drink swirl/details -->
    <ellipse cx="23.5" cy="22" rx="11.5" ry="3" fill="#ff80ab"/>
    <rect x="22" y="10" width="3" height="14" fill="#00e676" rx="1.5"/>
  </g>
  <!-- Popcorn bucket -->
  <g transform="translate(48, 30)">
