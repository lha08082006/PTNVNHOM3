<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg2)"/>
  <!-- Cups and Snacks in background -->
  <g transform="translate(15, 20)">
    <!-- Blue Pepsi cup -->
    <polygon points="10,20 26,20 23,50 13,50" fill="#1565c0"/>
    <ellipse cx="18" cy="20" rx="8" ry="2" fill="#42a5f5"/>
    <rect x="17" y="10" width="2" height="12" fill="#ffffff"/>
    
    <!-- Red snack bag -->
    <polygon points="40,22 55,24 53,50 38,48" fill="#d32f2f"/>
    <text x="46" y="38" font-size="6" font-weight="bold" fill="#ffeb3b" text-anchor="middle">Oishi</text>
  </g>
  <!-- 2 Popcorn Buckets -->
  <g transform="translate(35, 26)">
    <!-- Popcorn cluster -->
    <circle cx="20" cy="10" r="7" fill="#fff59d"/>
    <circle cx="30" cy="8" r="6" fill="#ffe082"/>
    <circle cx="38" cy="11" r="6" fill="#fff59d"/>
    <circle cx="14" cy="14" r="5" fill="#ffe082"/>
    <circle cx="28" cy="15" r="7" fill="#fff9c4"/>
    <!-- Bucket 1 -->
    <polygon points="12,18 42,18 38,54 16,54" fill="#0d47a1"/>
    <rect x="20" y="26" width="14" height="14" fill="#ffe082" rx="2"/>
    <text x="27" y="36" font-size="6" font-family="Arial" font-weight="bold" fill="#0d47a1" text-anchor="middle">beta</text>
  </g>
  <!-- Ribbon Badge -->
  <g transform="translate(10, 78)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#ef6c00"/>
    <rect x="2" y="2" width="96" height="20" rx="10" fill="#ff9800"/>
    <text x="50" y="16" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FAMILY COMBO</text>
  </g>
</svg>
